name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  semantic_pull_request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: "**/*.md"
      modified_files_only: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Same Flutter as claire-app (.puro.json). Bump together with the app.
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .freezed/.g files are git-ignored, so generate them before analyzing.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze lib

      # The package has no test/ folder yet; run tests once one exists.
      - name: Test
        if: hashFiles('test/**') != ''
        run: flutter test
