name: example
description: An example app for the contentful_flutter package
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.1+2

environment:
  sdk: ">=3.1.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # ... Utils ...
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.0
  # ... Code generation ...
  freezed_annotation: ^3.1.0
  # ... Package ...
  contentful_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.1.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
